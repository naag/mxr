<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play on a phone · Bass Synth Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0D1014}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0D1014; color: #E8EAED; font-family: 'Instrument Sans', system-ui, sans-serif">

<header style="flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-bottom: 1px solid #1B2229">
<div style="width: 30px; height: 30px; border-radius: 9px; background: #151A20; border: 1px solid #262E37; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 24 L13 9 V24 L22 9 V24" stroke="#F2A93B" style="stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round"></path><path d="M3 15 C 14 15, 20 15, 23 10 C 25 7, 26 20, 29 27" stroke="#43C6CF" style="stroke-width: 2.4; stroke-linecap: round"></path></svg>
</div>
<span style="font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em">Bass Synth Explorer</span>
<button type="button" aria-label="Sound is on. Tap to mute." style="margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #7FD8DF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
</button>
<button type="button" aria-label="Open menu" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #C9D1D9; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</header>

<div style="flex: 0 0 auto; margin-top: -8px">
<dc-import name="Pedal" compact="{{ true }}" caption="{{ false }}" focus="cutoff" hint-size="100%,450px"></dc-import>
</div>

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
<div role="tablist" aria-label="Visuals" style="display: flex; gap: 4px; border-bottom: 1px solid #1E252D">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.click}}" style="flex: 1; min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 13.5px; cursor: pointer; color: {{t.fg}}; font-weight: {{t.weight}}; box-shadow: inset 0 -2px 0 {{t.bar}}">{{t.label}}</button>
</sc-for>
</div>
<section aria-label="{{panelLabel}}" style="flex: 1 1 auto; min-height: 0; background: #11161C; border: 1px solid #1E252D; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<svg viewBox="0 0 360 132" style="width: 100%; height: auto; display: block" role="img" aria-label="{{panelLabel}}">
<g stroke="#1B222A" style="stroke-width: 1"><path d="M0 22 H360 M0 110 H360 M72 0 V132 M216 0 V132 M288 0 V132"></path></g>
<path d="M0 66 H360" stroke="#2A323C" style="stroke-width: 1"></path>
<path d="M144 4 V128" stroke="#3A4450" style="stroke-width: 1; stroke-dasharray: 3 4"></path>
<g opacity="{{waveOp}}">
<path d="{{scopeRaw}}" fill="none" stroke="#F2A93B" opacity="0.55" style="stroke-width: 1.6; stroke-dasharray: 4 3"></path>
<path d="{{scopeFil}}" fill="none" stroke="#43C6CF" style="stroke-width: 2.4; stroke-linejoin: round"></path>
</g>
<g opacity="{{specOp}}">
<path d="{{specFil}}" stroke="#F2A93B" style="stroke-width: 1.6"></path>
<path d="{{specCurve}}" fill="none" stroke="#43C6CF" style="stroke-width: 2.2"></path>
</g>
</svg>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #A3ADB7">
<span>{{panelHint}}</span>
<span style="font-family: 'JetBrains Mono', monospace; color: #C9D1D9; white-space: nowrap">A1 · 55 Hz</span>
</div>
</section>
</div>

<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px 14px; margin-top: 10px; border-top: 1px solid #1B2229; background: #0F1318">
<button type="button" aria-label="Pause riff" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #F2A93B; color: #1A1206; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3.2; stroke-linecap: round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
<span style="font-size: 14.5px; font-weight: 600">Funk Drop</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8F99A3">riff · 96 BPM</span>
</div>
<button type="button" aria-label="Show fretboard" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A313A; background: #151A20; color: #C9D1D9; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 1.8; stroke-linecap: round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9.5h18M3 14.5h18M9 5v14M15 5v14"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { tab: 0 };
  }

  compute() {
    if (this._c) return this._c;
    const f0 = 55, fc = 520, k = 3, N = 218;
    const H = (f) => {
      const b = f / fc;
      const r2 = 1 - b * b, i2 = 2 * b;
      const r4 = r2 * r2 - i2 * i2 + k, i4 = 2 * r2 * i2;
      const m2 = r4 * r4 + i4 * i4;
      const re = ((1 + k) * r4) / m2, im = (-(1 + k) * i4) / m2;
      return { mag: Math.hypot(re, im), ph: Math.atan2(im, re) };
    };
    const hs = [];
    for (let n = 1; n <= N; n++) hs.push(H(n * f0));
    const f1 = (v) => (Math.round(v * 10) / 10).toString();
    const W = 360, mid = 66, amp = 54, cycles = 2.5, pts = 180;
    const vals = [];
    let peak = 0;
    for (let i = 0; i <= pts; i++) {
      const t = (cycles / f0) * (i / pts);
      let v = 0;
      for (let n = 1; n <= N; n++) v -= (hs[n - 1].mag / n) * Math.sin(2 * Math.PI * n * f0 * t + hs[n - 1].ph);
      vals.push(v);
      peak = Math.max(peak, Math.abs(v));
    }
    const norm = Math.max(peak, 1.75);
    const scopeFil = 'M' + vals.map((v, i) => f1((W * i) / pts) + ' ' + f1(mid - (amp * v) / norm)).join(' L');
    const sa = ((Math.PI / 2) / norm) * amp, cyc = W / cycles;
    const lo = f1(mid + sa), hi = f1(mid - sa);
    const scopeRaw = 'M0 ' + lo + ' L' + cyc + ' ' + hi + ' V' + lo + ' L' + 2 * cyc + ' ' + hi + ' V' + lo + ' L' + W + ' ' + mid;
    const L0 = Math.log10(20), L1 = Math.log10(12000);
    const lx = (f) => (W * (Math.log10(f) - L0)) / (L1 - L0);
    const ly = (db) => 8 + (18 - db) * (118 / 84);
    const clip = (db) => Math.max(db, -66);
    let specFil = '';
    for (let n = 1; n <= N; n++) {
      const df = -20 * Math.log10(n) + 20 * Math.log10(hs[n - 1].mag);
      specFil += 'M' + f1(lx(n * f0)) + ' 126V' + f1(ly(clip(df))) + ' ';
    }
    const curve = [];
    for (let i = 0; i <= 120; i++) {
      const f = 20 * Math.pow(600, i / 120);
      curve.push(f1(lx(f)) + ' ' + f1(ly(clip(20 * Math.log10(H(f).mag)))));
    }
    this._c = { scopeRaw, scopeFil, specFil, specCurve: 'M' + curve.join(' L') };
    return this._c;
  }

  renderVals() {
    const c = this.compute();
    const tab = this.state.tab;
    const names = ['Wave', 'Spectrum', 'Envelope', 'Pitch'];
    const tabs = names.map((label, i) => ({
      label,
      selected: tab === i ? 'true' : 'false',
      fg: tab === i ? '#E8EAED' : '#8F99A3',
      weight: tab === i ? 600 : 500,
      bar: tab === i ? '#43C6CF' : 'transparent',
      click: () => this.setState({ tab: i })
    }));
    const showSpec = tab === 1;
    return Object.assign({}, c, {
      tabs,
      waveOp: showSpec ? 0 : 1,
      specOp: showSpec ? 1 : 0,
      panelLabel: showSpec ? 'Spectrum with the filter curve' : 'Waveform before and after the filter',
      panelHint: showSpec ? 'Bars = harmonics · line = filter' : 'Dashed = oscillator · solid = after filter'
    });
  }
}
</script>
</body>
</html>
