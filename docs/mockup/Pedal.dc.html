<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bass Synth pedal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; font-family: 'Instrument Sans', system-ui, sans-serif; color: #E8EAED; background: radial-gradient(ellipse 70% 55% at 50% 42%, #1A2128 0%, #0D1014 72%)">

<sc-if value="{{showTopBar}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; width: 100%; max-width: 440px">
<span style="width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: {{bankColor}}; box-shadow: 0 0 10px {{bankGlow}}"></span>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #9AA4AE">{{presetCode}}</span>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.01em">{{presetName}}</span>
</div>
<sc-if value="{{edited}}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid #3A4450; color: #C9D1D9">edited</span>
</sc-if>
<button type="button" aria-label="Previous preset" onClick="{{prevPreset}}" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2A313A; background: #141920; color: #C9D1D9; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<button type="button" aria-label="Next preset" onClick="{{nextPreset}}" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2A313A; background: #141920; color: #C9D1D9; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
</button>
</div>
</sc-if>

<div style="position: relative; width: 100%; max-width: {{maxW}}; aspect-ratio: {{aspect}}">

<script type="text/x-dc" data-dc-script data-props='{"layer":{"editor":"enum","options":["main","voice","shape"],"default":"main"},"focus":{"editor":"enum","options":["none","mix","cutoff","envelope","sub","resonance","mod"],"default":"none"},"spotlight":{"editor":"enum","options":["none","mix","cutoff","envelope","sub","resonance","mod"],"default":"none"},"caption":{"editor":"boolean","default":true},"compact":{"editor":"boolean","default":false},"$preview":{"width":560,"height":1080}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const P = this.presets();
    const start = 3;
    this.drag = null;
    this.holdTimer = null;
    this.held = null;
    this.skipClick = false;
    this.state = {
      preset: start,
      vals: this.valsOf(P[start]),
      shape: P[start].shape,
      voiceOn: !!P[start].voice,
      engaged: true,
      layer: null,
      hold: null,
      focus: this.initialFocus(),
      dragging: null,
      edited: false
    };
  }

  posKeys() { return ['mix', 'cutoff', 'envelope', 'sub', 'resonance', 'mod']; }

  initialFocus() {
    const f = this.props ? this.props.focus : null;
    const i = this.posKeys().indexOf(f);
    return i >= 0 ? i : null;
  }

  presets() {
    if (this._p) return this._p;
    const V = { vmix: 12, noise: 7, envamt: 14, ampenv: 7, glide: 7, blend: 9 };
    const S = { comp: 9, gain: 12, gate: 12, dry: 7, track: 7, out: 7 };
    const mk = (code, name, shape, voice, m, v, s) => ({ code, name, shape, voice, m: Object.assign({}, m), v: Object.assign({}, V, v || {}), s: Object.assign({}, S, s || {}) });
    this._p = [
      mk('LIVE', 'Live mode', 1, false, { mix: 14, sub: 11, cutoff: 11, env: 10, res: 12, mod: 9 }),
      mk('G1', 'Thrillenganes', 1, false, { mix: 15, sub: 13, cutoff: 11, env: 9, res: 10, mod: 7 }, null, { comp: 10 }),
      mk('G2', 'Wonderful', 2, false, { mix: 14, sub: 9, cutoff: 9, env: 9, res: 14, mod: 7 }, { envamt: 15, glide: 9 }),
      mk('G3', 'Lizard Synth', 1, false, { mix: 16, sub: 9, cutoff: 10, env: 11, res: 15, mod: 7 }),
      mk('G4', 'Synthadelic', 2, false, { mix: 16, sub: 14, cutoff: 15, env: 7, res: 10, mod: 8 }, { glide: 10 }),
      mk('R1', 'Sledge', 0, false, { mix: 13, sub: 14, cutoff: 13, env: 7, res: 9, mod: 12 }, { blend: 8 }, { comp: 15 }),
      mk('R2', 'Army of Synth', 1, true, { mix: 15, sub: 11, cutoff: 10, env: 10, res: 12, mod: 7 }, { vmix: 13 }, { comp: 14 }),
      mk('R3', 'Nine Inch Synth', 2, true, { mix: 16, sub: 10, cutoff: 12, env: 10, res: 13, mod: 7 }, { noise: 9 }),
      mk('R4', 'Synthmau5', 1, false, { mix: 17, sub: 11, cutoff: 10, env: 13, res: 12, mod: 10 }, { envamt: 9, ampenv: 11, blend: 15 })
    ];
    return this._p;
  }

  valsOf(p) { return Object.assign({}, p.m, p.v, p.s); }

  meta() {
    if (this._m) return this._m;
    const C = { osc: '#F2A93B', filter: '#43C6CF', env: '#A68BF5', mod: '#EE7BB8', out: '#A6D96A', input: '#8C99A8' };
    this._m = {
      pos: [
        { x: 135, y: 215, main: 'mix', voice: 'vmix', shape: 'comp' },
        { x: 365, y: 215, main: 'cutoff', voice: 'envamt', shape: 'gate' },
        { x: 590, y: 215, main: 'env', voice: 'ampenv', shape: 'dry' },
        { x: 135, y: 446, main: 'sub', voice: 'noise', shape: 'gain' },
        { x: 365, y: 446, main: 'res', voice: 'glide', shape: 'track' },
        { x: 590, y: 446, main: 'mod', voice: 'blend', shape: 'out' }
      ],
      params: {
        mix: { label: 'MIX', color: C.out, one: 'Blends your clean bass with the synth. Left: more of your real bass. Right: more synth.' },
        cutoff: { label: 'CUTOFF', color: C.filter, one: 'How bright the synth is. The filter lets low sounds through and blocks high ones. Left: darker. Right: brighter.' },
        env: { label: 'ENVELOPE', color: C.env, one: 'How fast the brightness blooms and fades after each note. Left: quick pluck. Right: slow sweep. Fully left: off.' },
        sub: { label: 'SUB MIX', color: C.osc, one: 'Blends in a second synth voice one octave lower. Left: main synth only. Right: deep sub only.' },
        res: { label: 'RESONANCE', color: C.filter, one: 'Adds a sharp, singing peak right at the cutoff point. Left: smooth. Right: squelchy and vocal.' },
        mod: { label: 'MOD', color: C.mod, one: 'Adds movement: a chorus shimmer or a pulsing filter wobble. Left: still. Right: moving.' },
        vmix: { label: 'VOICE MIX', color: C.osc, one: 'How loud the extra harmony voices are. Fully left removes them.' },
        envamt: { label: 'FILTER ENV AMT', color: C.env, one: 'How far, and which way, the envelope moves the cutoff. Above noon notes bloom brighter, below noon they duck darker.' },
        ampenv: { label: 'AMP ENV', color: C.env, one: 'How slowly each note fades in. Left: instant. Right: slow swell.' },
        noise: { label: 'NOISE MIX', color: C.osc, one: 'Blends in hiss for breathy or gritty textures.' },
        glide: { label: 'GLIDE', color: C.osc, one: 'Slides smoothly from one note to the next instead of jumping.' },
        blend: { label: 'MOD BLEND', color: C.mod, one: 'Chooses what MOD moves. Left: chorus shimmer. Right: filter wobble (LFO).' },
        comp: { label: 'COMP', color: C.out, one: 'Evens out loud and soft notes, from off to tight limiting.' },
        gate: { label: 'GATE SENS.', color: C.input, one: 'How easily soft notes trigger the synth. Applies to all presets.' },
        dry: { label: 'DRY THRU FX', color: C.out, steps: 2, one: 'When on, your clean bass also runs through the filter and effects.' },
        gain: { label: 'OUTPUT GAIN', color: C.out, one: 'Overall volume, plus or minus 18 dB. Noon is 0 dB.' },
        track: { label: 'TRACKING', color: C.input, steps: 3, one: 'Tells the pedal which instrument range to listen for: 5-string, 4-string or guitar.' },
        out: { label: 'OUTPUT MODE', color: C.out, steps: 3, one: 'How the sound leaves the pedal: mono, wet left and dry right, or full stereo.' }
      }
    };
    return this._m;
  }

  readout(id, h) {
    const k = (h - 7) / 10;
    const pct = Math.round(k * 100);
    const ms = (v) => (v >= 1000 ? (v / 1000).toFixed(2) + ' s' : Math.round(v) + ' ms');
    const hz = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + ' kHz' : Math.round(v) + ' Hz');
    const step = (n) => Math.round(k * (n - 1));
    switch (id) {
      case 'mix': return pct + '% synth';
      case 'cutoff': return hz(40 * Math.pow(2, 8 * k));
      case 'env': return k < 0.02 ? 'off' : 'attack ' + ms(Math.pow(300, k)) + ', decay ' + ms(60 * Math.pow(50, k));
      case 'sub': return pct + '% sub';
      case 'res': return pct + '%' + (k > 0.7 ? ', strong peak' : k > 0.35 ? ', clear peak' : ', smooth');
      case 'mod': return k < 0.02 ? 'off' : pct + '% depth, ' + (0.3 * Math.pow(20, k)).toFixed(1) + ' Hz';
      case 'vmix': return pct + '% voices';
      case 'noise': return pct + '% noise';
      case 'envamt': { const o = (k - 0.5) * 10; return (o >= 0 ? '+' : '−') + Math.abs(o).toFixed(1) + ' oct, ' + (o >= 0 ? 'opens' : 'closes'); }
      case 'ampenv': return 'fade-in ' + ms(Math.pow(1500, k));
      case 'glide': return k < 0.02 ? 'off' : ms(5 * Math.pow(200, k));
      case 'blend': return Math.round((1 - k) * 100) + '% chorus, ' + pct + '% LFO';
      case 'comp': return k < 0.02 ? 'off' : pct + '%' + (k > 0.9 ? ', limiting' : '');
      case 'gate': return pct + '% sensitivity';
      case 'dry': return k < 0.5 ? 'OFF' : 'ON';
      case 'gain': { const db = (k - 0.5) * 36; return (db >= 0 ? '+' : '−') + Math.abs(db).toFixed(1) + ' dB'; }
      case 'track': return ['5-string bass', '4-string bass', 'guitar'][step(3)];
      case 'out': return ['MONO', 'WET/DRY', 'STEREO'][step(3)];
    }
    return '';
  }

  clock(h) {
    if (h <= 7.05) return 'min';
    if (h >= 16.95) return 'max';
    const r = Math.round(h);
    return (((r - 1) % 12) + 1) + ' o’clock';
  }

  snap(h, n) {
    const idx = Math.round(((h - 7) / 10) * (n - 1));
    return 7 + (idx * 10) / (n - 1);
  }

  setVal(id, h) {
    const p = this.meta().params[id];
    let v = Math.max(7, Math.min(17, h));
    if (p.steps) v = this.snap(v, p.steps);
    const s = this.state;
    if (s.vals[id] === v) return;
    this.setState({ vals: Object.assign({}, s.vals, { [id]: v }), edited: s.preset !== 0 });
  }

  applyPreset(i) {
    const p = this.presets()[i];
    this.setState({ preset: i, vals: this.valsOf(p), shape: p.shape, voiceOn: !!p.voice, edited: false });
  }

  holdStart(which) {
    clearTimeout(this.holdTimer);
    this.held = null;
    this.holdTimer = setTimeout(() => { this.held = which; this.setState({ hold: which }); }, 320);
  }

  holdEnd() {
    clearTimeout(this.holdTimer);
    if (this.held) {
      this.held = null;
      this.skipClick = true;
      this.setState({ hold: null });
    }
  }

  arc(r, a0, a1) {
    const pt = (a) => { const t = (a * Math.PI) / 180; return (r * Math.sin(t)).toFixed(1) + ' ' + (-r * Math.cos(t)).toFixed(1); };
    if (a1 - a0 < 0.5) return 'M' + pt(a0);
    return 'M' + pt(a0) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + pt(a1);
  }

  renderVals() {
    const s = this.state;
    const props = this.props || {};
    const P = this.presets();
    const M = this.meta();
    const compact = props.compact === true || props.compact === 'true';
    const caption = !(props.caption === false || props.caption === 'false');
    const layer = s.hold || s.layer || (props.layer === 'voice' || props.layer === 'shape' ? props.layer : 'main');
    const spot = this.posKeys().indexOf(props.spotlight);
    const preset = P[s.preset];

    const vbH = compact ? 600 : 1350;
    const pct = (v) => Math.round(v * 1000) / 1000;
    const knobs = M.pos.map((p, i) => {
      const id = p[layer];
      const h = s.vals[id];
      return { id, rot: Math.round((h - 12) * 30 * 10) / 10, dim: spot >= 0 && spot !== i ? 0.28 : 1 };
    });

    const focus = s.focus;
    let ring = { on: 0, x: 0, y: 0, track: 'M0 0', value: 'M0 0', color: '#43C6CF' };
    if (focus != null) {
      const p = M.pos[focus];
      const id = p[layer];
      ring = { on: 1, x: p.x, y: p.y, track: this.arc(101, -150, 150), value: this.arc(101, -150, (s.vals[id] - 12) * 30), color: M.params[id].color };
    }

    const step3 = (h) => Math.round(((h - 7) / 10) * 2);
    const on = (b) => (b ? 1 : 0.4);
    const v = s.vals;
    const lg = {
      on: layer === 'shape' ? 1 : 0,
      c0: on(v.comp < 8), c1: on(v.comp > 16),
      d0: on(v.dry < 12), d1: on(v.dry >= 12),
      t0: on(step3(v.track) === 0), t1: on(step3(v.track) === 1), t2: on(step3(v.track) === 2),
      o0: on(step3(v.out) === 0), o1: on(step3(v.out) === 1), o2: on(step3(v.out) === 2)
    };

    const pi = s.preset;
    const pl = {};
    for (let i = 0; i < 4; i++) {
      const lit = pi > 0 && (pi - 1) % 4 === i;
      const a = lit ? (s.edited ? 0.55 : 1) : 0;
      pl['g' + i] = pi > 0 && pi <= 4 ? a : 0;
      pl['r' + i] = pi > 4 ? a : 0;
    }
    const bankColor = pi === 0 ? '#5B6470' : pi <= 4 ? '#5FD35A' : '#E5484D';

    const ox = (x) => pct(((x + 34) / 804) * 100);
    const oy = (y) => pct(((y + 10) / vbH) * 100);
    const sz = (d) => pct((d / 804) * 100);
    const hot = M.pos.map((p, i) => {
      const id = p[layer];
      const par = M.params[id];
      return {
        aria: par.label + ' knob, ' + this.clock(v[id]) + ', ' + this.readout(id, v[id]) + '. Drag up or down, or use the arrow keys.',
        left: ox(p.x), top: oy(p.y), size: sz(176), cursor: 'ns-resize',
        down: (e) => {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { }
          this.drag = { i, id, y: e.clientY, v: v[id] };
          this.setState({ dragging: i, focus: i });
        },
        move: (e) => {
          const d = this.drag;
          if (!d || d.i !== i) return;
          this.setVal(d.id, d.v + (d.y - e.clientY) / 16);
        },
        up: () => {
          if (this.drag && this.drag.i === i) { this.drag = null; this.setState({ dragging: null }); }
        },
        key: (e) => {
          const stepH = par.steps ? 10 / (par.steps - 1) : 0.25;
          let nv = v[id];
          if (e.key === 'ArrowUp' || e.key === 'ArrowRight') nv += stepH;
          else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') nv -= stepH;
          else if (e.key === 'PageUp') nv += 1;
          else if (e.key === 'PageDown') nv -= 1;
          else if (e.key === 'Home') nv = 7;
          else if (e.key === 'End') nv = 17;
          else return;
          e.preventDefault();
          this.setVal(id, nv);
        },
        enter: () => this.setState({ focus: i }),
        leave: () => { if (this.state.dragging == null) this.setState({ focus: this.initialFocus() }); }
      };
    });
    hot.push({
      aria: 'VOICE button. Tap to add harmony voices. Hold to show the voice layer.',
      left: ox(258), top: oy(96), size: sz(88), cursor: 'pointer',
      click: () => { if (this.skipClick) { this.skipClick = false; return; } this.setState({ voiceOn: !this.state.voiceOn, edited: this.state.preset !== 0 }); },
      down: () => this.holdStart('voice'), up: () => this.holdEnd(), pleave: () => this.holdEnd()
    });
    hot.push({
      aria: 'SHAPE button. Tap to change the waveform. Hold to show the shape layer.',
      left: ox(478), top: oy(98), size: sz(88), cursor: 'pointer',
      click: () => { if (this.skipClick) { this.skipClick = false; return; } this.setState({ shape: (this.state.shape + 1) % 3, edited: this.state.preset !== 0 }); },
      down: () => this.holdStart('shape'), up: () => this.holdEnd(), pleave: () => this.holdEnd()
    });
    if (!compact) {
      hot.push({
        aria: s.engaged ? 'Footswitch. The synth is on. Tap to bypass.' : 'Footswitch. The synth is bypassed. Tap to turn it on.',
        left: ox(365), top: oy(960), size: sz(184), cursor: 'pointer',
        click: () => this.setState({ engaged: !this.state.engaged })
      });
      hot.push({
        aria: 'PRESETS button. Tap for the next preset.',
        left: ox(488), top: oy(1205), size: sz(56), cursor: 'pointer',
        click: () => this.applyPreset((this.state.preset + 1) % P.length)
      });
    }

    const layerDefs = [
      { key: 'main', label: 'Main', sub: 'as printed', bg: '#2A313A', fg: '#E8EAED' },
      { key: 'voice', label: 'Voice layer', sub: 'hold VOICE', bg: 'rgba(94, 200, 255, 0.16)', fg: '#8FD3FF' },
      { key: 'shape', label: 'Shape layer', sub: 'hold SHAPE', bg: 'rgba(99, 219, 120, 0.15)', fg: '#8BE59A' }
    ];
    const layers = layerDefs.map((d) => ({
      label: d.label, sub: d.sub,
      pressed: layer === d.key ? 'true' : 'false',
      bg: layer === d.key ? d.bg : 'transparent',
      fg: layer === d.key ? d.fg : '#9AA4AE',
      click: () => this.setState({ layer: d.key })
    }));

    const shapeNames = ['Triangle: smooth and subtle', 'Sawtooth: rich and aggressive', 'Square: fat, rubbery punch'];
    let cap;
    if (focus != null) {
      const id = M.pos[focus][layer];
      const par = M.params[id];
      cap = { title: par.label, value: this.clock(v[id]) + ' · ' + this.readout(id, v[id]), text: par.one, color: par.color };
    } else {
      cap = {
        title: 'Try it',
        value: shapeNames[s.shape].split(':')[0],
        text: 'Drag a knob up or down. Tap SHAPE, VOICE, the footswitch or PRESETS. Hold VOICE or SHAPE (or use the layer switch) to reveal the hidden second set of controls.',
        color: '#F2A93B'
      };
    }

    const labelFill = layer === 'voice' ? '#8FD3FF' : layer === 'shape' ? '#8BE59A' : '#E6E4DF';
    return {
      showTopBar: !compact,
      compact,
      showCaption: caption && !compact,
      maxW: compact ? '100%' : '440px',
      aspect: '804 / ' + vbH,
      vb: '-34 -10 804 ' + vbH,
      encH: compact ? 586 : 1308,
      encHi: compact ? 580 : 1302,
      svgLabel: 'MXR Bass Synth pedal, ' + (pi === 0 ? 'live mode' : preset.code + ' ' + preset.name) + ', synth ' + (s.engaged ? 'on' : 'bypassed'),
      trans: s.dragging != null ? 'none' : 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)',
      k0: knobs[0], k1: knobs[1], k2: knobs[2], k3: knobs[3], k4: knobs[4], k5: knobs[5],
      l0: M.params[knobs[0].id].label, l1: M.params[knobs[1].id].label, l2: M.params[knobs[2].id].label,
      l3: M.params[knobs[3].id].label, l4: M.params[knobs[4].id].label, l5: M.params[knobs[5].id].label,
      labelFill,
      lg,
      ring,
      ledTri: s.shape === 0 ? 1 : 0,
      ledSaw: s.shape === 1 ? 1 : 0,
      ledSq: s.shape === 2 ? 1 : 0,
      voiceRing: s.voiceOn ? 1 : 0,
      voiceGlow: s.voiceOn ? 0.45 : 0,
      voiceTint: layer === 'voice' ? 0.85 : 0,
      shapeTint: layer === 'shape' ? 0.85 : 0,
      bypassOn: s.engaged ? 1 : 0,
      bypassGlow: s.engaged ? 0.7 : 0,
      pl,
      hot,
      layers,
      cap,
      presetCode: pi === 0 ? 'LIVE' : preset.code + (pi <= 4 ? ' · GREEN' : ' · RED'),
      presetName: pi === 0 ? 'Live mode (your knobs)' : preset.name,
      bankColor,
      bankGlow: pi === 0 ? 'transparent' : bankColor,
      edited: s.edited,
      prevPreset: () => this.applyPreset((this.state.preset + P.length - 1) % P.length),
      nextPreset: () => this.applyPreset((this.state.preset + 1) % P.length),
      toggleEngaged: () => this.setState({ engaged: !this.state.engaged }),
      engagedStr: s.engaged ? 'true' : 'false',
      fsLabel: s.engaged ? 'Synth on' : 'Bypassed',
      fsDot: s.engaged ? '#49B9F0' : '#3A4450',
      fsGlow: s.engaged ? '#49B9F0' : 'transparent'
    };
  }
}
</script>
</body>
</html>
